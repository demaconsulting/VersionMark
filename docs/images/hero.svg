<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <!-- The README hero banner. The .versionmark.yaml tool definitions, the version output of each tool command,
       and the CI job IDs flow into the versionmark tool, and come out as a Markdown versions report, per-job JSON
       capture files, lint findings for the configuration, and self-validation test results.
       The definitions and the left panel follow the shared DEMA Consulting hero (CanvasNet and BuildMark).
       This file is docs/images/hero.svg, beside its rendered docs/images/hero.png (matching base names, per the
       diagram documentation standard); the files it embeds are in docs/images/hero/. -->
  <defs>
    <style>
      .word { font: bold 92px sans-serif; fill: #ffffff; }
      .eyebrow { font: bold 25px sans-serif; fill: #a5b4fc; }
      .tag { font: bold 36px sans-serif; fill: #f8fafc; }
      .body { font: 25px sans-serif; fill: #cbd5e1; }
      .cmd { font: 25px monospace; fill: #e2e8f0; }
      .prompt { fill: #5eead4; }
      .file { fill: #f9a8d4; }
      .brandText { fill: url(#brand); }
      .note { font: italic 25px sans-serif; fill: #94a3b8; }
      .label { font: bold 25px sans-serif; fill: #f1f5f9; text-anchor: middle; }
      .engine { font: bold 32px monospace; fill: #ffffff; }
      .api { font: bold 25px sans-serif; fill: #c4b5fd; }
      .card { fill: url(#glass); stroke: url(#rim); stroke-width: 1.5; filter: url(#shadow); }
      .panel { fill: #0a1022; stroke: #ffffff; stroke-opacity: 0.06; }
      .flow { fill: none; stroke-width: 3; stroke-linecap: round; }
      .page { fill: #ffffff; filter: url(#paper); }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.55" stop-color="#130f3b"/>
      <stop offset="1" stop-color="#071a2e"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#db2777" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#a5b4fc" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="engineFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b1022"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="blur" x="-30%" y="-150%" width="160%" height="400%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="heat" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <marker id="headPink" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#f472b6"/>
    </marker>
    <marker id="headAmber" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#fbbf24"/>
    </marker>
    <marker id="headCyan" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#22d3ee"/>
    </marker>
    <marker id="headViolet" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#a78bfa"/>
    </marker>
    <marker id="headBlue" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#60a5fa"/>
    </marker>
    <marker id="headMint" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#5eead4"/>
    </marker>

    <!-- The text and shapes inside the mini illustrations -->
    <style>
      .mini { font: bold 22px sans-serif; }
      .miniMono { font: bold 22px monospace; }
      .bar { fill: #cbd5e1; }
      .ink { fill: #1e293b; }
      .soft { fill: #475569; }
    </style>
  </defs>

  <!-- Background: deep gradient, soft glows, and a dot grid -->
  <rect width="1600" height="640" fill="url(#bg)"/>
  <ellipse cx="250" cy="170" rx="420" ry="300" fill="url(#glowViolet)"/>
  <ellipse cx="1070" cy="294" rx="420" ry="220" fill="url(#glowCyan)"/>
  <ellipse cx="1480" cy="620" rx="380" ry="260" fill="url(#glowPink)"/>
  <rect width="1600" height="640" fill="url(#dots)"/>

  <!-- Wordmark and tagline: "VersionMark" is 6002 units, so both words use 81px. "Mark" starts at x = 345.1,
       where the renderer ends "Version" (measured by drawing "Version<tspan>Mark</tspan>" as one text); the
       table value 52 + 0.081 * 3668 = 349.1 left a visible gap. -->
  <image href="hero/dc-logo-dark.svg" x="46" y="54" width="50" height="50"/>
  <text class="eyebrow" x="100" y="90">DEMA Consulting</text>
  <text class="word" x="52" y="176" style="font-size:81px">Version</text>
  <text class="word brandText" x="345.1" y="176" style="font-size:81px">Mark</text>
  <rect x="58" y="200" width="132" height="6" rx="3" fill="url(#brand)"/>
  <text class="tag" x="56" y="266">Tool versions captured</text>
  <text class="tag" x="56" y="314" style="fill: #a5b4fc">from CI/CD jobs.</text>
  <text class="body" x="58" y="368">Saves tool versions per job as JSON,</text>
  <text class="body" x="58" y="402">merges the jobs into one Markdown</text>
  <text class="body" x="58" y="436">report, and lints .versionmark.yaml.</text>
  <rect x="56" y="468" width="480" height="90" rx="12" fill="#0a1022" fill-opacity="0.8" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.5"/>
  <text class="cmd prompt" x="78" y="503">$</text>
  <text class="cmd" x="108" y="503">versionmark --capture</text>
  <text class="cmd" x="138" y="539">--job-id</text>
  <text class="cmd file" x="273" y="539">linux</text>
  <text class="cmd" x="363" y="539">-- dotnet</text>
  <text class="note" x="58" y="604">.NET 10 and 11 &#183; Windows, Linux, macOS</text>

  <!-- Input cards: three inputs spread over x = 580 to 1560 -->
  <g>
    <!-- Input one: the .versionmark.yaml tool definitions -->
    <rect class="card" x="580" y="40" width="318" height="160" rx="16"/>
    <rect x="683" y="40" width="112" height="3" rx="1.5" fill="#fbbf24"/>
    <rect class="panel" x="588" y="48" width="302" height="112" rx="10"/>
    <g transform="translate(588 48)">
      <path class="page" d="M18 12 L62 12 L78 28 L78 100 L18 100 Z"/>
      <path d="M62 12 L62 28 L78 28 Z" fill="#cbd5e1"/>
      <rect x="28" y="40" width="40" height="5" rx="2.5" fill="#fbbf24"/>
      <rect class="bar" x="28" y="52" width="40" height="5" rx="2.5"/>
      <rect class="bar" x="28" y="64" width="30" height="5" rx="2.5"/>
      <rect class="bar" x="28" y="76" width="36" height="5" rx="2.5"/>
      <text class="miniMono" x="98" y="36" fill="#fde68a">tools:</text>
      <text class="miniMono" x="124" y="66" fill="#f8fafc">dotnet:</text>
      <text class="miniMono" x="150" y="96" fill="#cbd5e1">regex:</text>
    </g>
    <text class="label" x="739" y="190">.versionmark.yaml</text>

    <!-- Input two: the version output of a tool command -->
    <rect class="card" x="910" y="40" width="318" height="160" rx="16"/>
    <rect x="1013" y="40" width="112" height="3" rx="1.5" fill="#22d3ee"/>
    <rect class="panel" x="918" y="48" width="302" height="112" rx="10"/>
    <g transform="translate(918 48)">
      <circle cx="18" cy="16" r="4" fill="#f472b6"/>
      <circle cx="32" cy="16" r="4" fill="#fbbf24"/>
      <circle cx="46" cy="16" r="4" fill="#4ade80"/>
      <text class="miniMono" x="16" y="58" fill="#5eead4">$</text>
      <text class="miniMono" x="42" y="58" fill="#e2e8f0">dotnet --version</text>
      <text class="miniMono" x="16" y="92" fill="#a5f3fc">10.0.100</text>
    </g>
    <text class="label" x="1069" y="190">Tool version output</text>

    <!-- Input three: the CI job IDs -->
    <rect class="card" x="1240" y="40" width="320" height="160" rx="16"/>
    <rect x="1344" y="40" width="112" height="3" rx="1.5" fill="#f472b6"/>
    <rect class="panel" x="1248" y="48" width="304" height="112" rx="10"/>
    <g transform="translate(1248 48)">
      <rect x="20" y="14" width="96" height="36" rx="18" fill="#f472b6" fill-opacity="0.16" stroke="#f472b6" stroke-width="1.5"/>
      <text class="miniMono" x="68" y="40" fill="#fbcfe8" text-anchor="middle">linux</text>
      <rect x="128" y="14" width="124" height="36" rx="18" fill="#f472b6" fill-opacity="0.16" stroke="#f472b6" stroke-width="1.5"/>
      <text class="miniMono" x="190" y="40" fill="#fbcfe8" text-anchor="middle">windows</text>
      <rect x="20" y="62" width="96" height="36" rx="18" fill="#f472b6" fill-opacity="0.16" stroke="#f472b6" stroke-width="1.5"/>
      <text class="miniMono" x="68" y="88" fill="#fbcfe8" text-anchor="middle">macos</text>
      <rect x="128" y="62" width="156" height="36" rx="18" fill="#f472b6" fill-opacity="0.16" stroke="#f472b6" stroke-width="1.5"/>
      <text class="miniMono" x="206" y="88" fill="#fbcfe8" text-anchor="middle">net10-win</text>
    </g>
    <text class="label" x="1400" y="190">CI job IDs</text>
  </g>

  <!-- Flows into the engine -->
  <g class="flow">
    <path d="M739,206 C739,236 970,226 970,253" stroke="#fbbf24" marker-end="url(#headAmber)"/>
    <path d="M1069,206 C1069,236 1070,226 1070,253" stroke="#22d3ee" marker-end="url(#headCyan)"/>
    <path d="M1400,206 C1400,236 1170,226 1170,253" stroke="#f472b6" marker-end="url(#headPink)"/>
  </g>
  <g stroke="#0a1022" stroke-width="2">
    <circle cx="739" cy="206" r="5" fill="#fbbf24"/>
    <circle cx="1069" cy="206" r="5" fill="#22d3ee"/>
    <circle cx="1400" cy="206" r="5" fill="#f472b6"/>
  </g>
  <!-- The engine: "versionmark" is 11 characters, so the pill is 454px wide, centered at x = 1070 -->
  <rect x="843" y="262" width="454" height="64" rx="32" fill="url(#brand)" opacity="0.55" filter="url(#blur)"/>
  <rect x="843" y="262" width="454" height="64" rx="32" fill="url(#engineFill)" stroke="url(#brand)" stroke-width="2.5"/>
  <g transform="translate(-17 0)">
    <rect x="884" y="276" width="36" height="36" rx="9" fill="url(#brand)"/>
    <path d="M893 282 L906 282 L912 288 L912 306 L893 306 Z" fill="#ffffff"/>
    <g fill="#7c3aed">
      <rect x="897" y="290" width="11" height="2.5" rx="1.2"/>
      <rect x="897" y="295" width="11" height="2.5" rx="1.2"/>
      <rect x="897" y="300" width="7" height="2.5" rx="1.2"/>
    </g>
  </g>
  <text class="engine" x="919" y="305">versionmark</text>
  <line x1="1143" y1="278" x2="1143" y2="310" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
  <text class="api" x="1163" y="303">.NET tool</text>

  <!-- Flows out of the engine -->
  <g class="flow" stroke="#5eead4">
    <path d="M980,330 C980,356 728,356 728,381" marker-end="url(#headMint)"/>
    <path d="M1040,330 C1040,356 999,356 999,381" marker-end="url(#headMint)"/>
    <path d="M1100,330 C1100,356 1232,356 1232,381" marker-end="url(#headMint)"/>
    <path d="M1160,330 C1160,356 1457,356 1457,381" marker-end="url(#headMint)"/>
  </g>
  <g fill="#5eead4" stroke="#0a1022" stroke-width="2">
    <circle cx="980" cy="330" r="5"/>
    <circle cx="1040" cy="330" r="5"/>
    <circle cx="1100" cy="330" r="5"/>
    <circle cx="1160" cy="330" r="5"/>
  </g>

  <!-- Output tiles -->
  <g>
    <!-- Output one: the Markdown versions report -->
    <rect class="card" x="580" y="390" width="296" height="210" rx="16"/>
    <rect class="panel" x="588" y="398" width="280" height="152" rx="10"/>
    <path class="page" d="M604 406 L834 406 L852 424 L852 542 L604 542 Z"/>
    <path d="M834 406 L834 424 L852 424 Z" fill="#cbd5e1"/>
    <text class="mini" x="618" y="438" fill="#7c3aed">#</text>
    <text class="mini ink" x="640" y="438">Tool Versions</text>
    <circle cx="624" cy="472" r="4" fill="#7c3aed"/>
    <text class="mini ink" x="638" y="480">dotnet</text>
    <text class="mini soft" x="718" y="480">10.0.100</text>
    <circle cx="624" cy="512" r="4" fill="#7c3aed"/>
    <text class="mini ink" x="638" y="520">git</text>
    <text class="mini soft" x="718" y="520">2.47.1</text>
    <text class="label" x="728" y="585">Versions report</text>

    <!-- Output two: a per-job JSON capture file -->
    <rect class="card" x="889" y="390" width="220" height="210" rx="16"/>
    <rect class="panel" x="897" y="398" width="204" height="152" rx="10"/>
    <text class="miniMono" x="913" y="436" fill="#c4b5fd">{</text>
    <text class="miniMono" x="927" y="466" fill="#5eead4">"dotnet":</text>
    <text class="miniMono" x="941" y="496" fill="#f9a8d4">"10.0.100"</text>
    <text class="miniMono" x="913" y="526" fill="#c4b5fd">}</text>
    <text class="label" x="999" y="585">Per-job JSON</text>

    <!-- Output three: lint findings for the configuration file -->
    <rect class="card" x="1122" y="390" width="220" height="210" rx="16"/>
    <rect class="panel" x="1130" y="398" width="204" height="152" rx="10"/>
    <text class="miniMono" x="1146" y="436" fill="#f8fafc">--lint</text>
    <line x1="1146" y1="454" x2="1318" y2="454" stroke="#ffffff" stroke-opacity="0.15"/>
    <circle cx="1152" cy="480" r="5" fill="#f87171"/>
    <text class="miniMono" x="1166" y="488" fill="#e2e8f0">4:5</text>
    <text class="mini" x="1220" y="488" fill="#fecaca">error</text>
    <circle cx="1152" cy="520" r="5" fill="#fbbf24"/>
    <text class="miniMono" x="1166" y="528" fill="#e2e8f0">9:3</text>
    <text class="mini" x="1220" y="528" fill="#fde68a">warning</text>
    <text class="label" x="1232" y="585">Lint findings</text>

    <!-- Output four: the self-validation test results -->
    <rect class="card" x="1355" y="390" width="205" height="210" rx="16"/>
    <rect class="panel" x="1363" y="398" width="189" height="152" rx="10"/>
    <circle cx="1457" cy="448" r="24" fill="url(#brand)"/>
    <path d="M1446 448 L1454 456 L1469 440" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1377" y="494" width="160" height="38" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#5eead4" stroke-opacity="0.6" stroke-width="1.5"/>
    <text class="miniMono" x="1457" y="520" fill="#e2e8f0" text-anchor="middle">results.trx</text>
    <text class="label" x="1457" y="585">Test results</text>
  </g>
</svg>
