---
# FileAssert OTS Software Requirements
#
# Requirements for the FileAssert document assertion tool functionality.

sections:
  - title: OTS Software Requirements
    sections:
      - title: FileAssert Requirements
        requirements:
          - id: VersionMark-OTS-FileAssert
            title: FileAssert shall validate generated documents against acceptance
              criteria.
            justification: |
              DemaConsulting.FileAssert validates HTML and PDF documents produced during the
              build, asserting that each document exists, has a non-trivial size, is structurally
              valid, and contains expected content. It provides OTS evidence for Pandoc and
              WeasyPrint and independently confirms file assertion is functioning. Self-validation
              proves the tool itself is operational before ReqStream consumes the results.
            tags: [ots]
            tests:
              - FileAssert_VersionDisplay
              - FileAssert_HelpDisplay
              - Pandoc_BuildNotesHtml
              - WeasyPrint_BuildNotesPdf
              - Pandoc_CodeQualityHtml
              - WeasyPrint_CodeQualityPdf
              - Pandoc_ReviewPlanHtml
              - WeasyPrint_ReviewPlanPdf
              - Pandoc_ReviewReportHtml
              - WeasyPrint_ReviewReportPdf
              - Pandoc_DesignHtml
              - WeasyPrint_DesignPdf
              - Pandoc_VerificationHtml
              - WeasyPrint_VerificationPdf
              - Pandoc_UserGuideHtml
              - WeasyPrint_UserGuidePdf
