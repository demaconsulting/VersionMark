---
sections:
  - title: VersionMark Requirements
    sections:
      - title: SelfTest Requirements
        requirements:
          - id: VersionMark-Validate-Capture
            title: The tool shall verify the capture workflow end-to-end during self-validation.
            justification: |
              Self-validation of the capture workflow confirms the tool is correctly
              installed and able to execute commands and write JSON output in the
              deployment environment, catching integration problems before real runs.
            tags:
              - validation
            children:
              - VersionMark-Validation-Capture
            tests:
              - SelfTest_Run_WithResultsFlag_WritesResultsFile
              - SelfTest_Run_Capture_CapturesToolVersions

          - id: VersionMark-Validate-Publish
            title: The tool shall verify the publish workflow end-to-end during self-validation.
            justification: |
              Self-validation of the publish workflow confirms the tool can read JSON
              capture files and produce markdown reports in the deployment environment.
            tags:
              - validation
            children:
              - VersionMark-Validation-Publish
              - VersionMark-Validation-HeaderDepth
            tests:
              - SelfTest_Run_WithResultsFlag_WritesResultsFile
              - SelfTest_Run_Publish_GeneratesMarkdownReport

          - id: VersionMark-Validate-LintValid
            title: >-
              The tool shall verify that lint mode correctly accepts valid
              configurations during self-validation.
            justification: |
              Self-validation of lint mode's valid-config acceptance confirms the
              configuration validation logic approves correct configurations in the
              deployment environment.
            tags:
              - validation
            children:
              - VersionMark-Validation-LintValid
            tests:
              - SelfTest_Run_LintValid_PassesForValidConfig

          - id: VersionMark-Validate-LintInvalid
            title: >-
              The tool shall verify that lint mode correctly rejects invalid
              configurations during self-validation.
            justification: |
              Self-validation of lint mode's error-rejection confirms the
              configuration validation logic rejects bad configurations in the
              deployment environment.
            tags:
              - validation
            children:
              - VersionMark-Validation-LintInvalid
            tests:
              - SelfTest_Run_LintInvalid_RejectsInvalidConfig

          - id: VersionMark-Validate-Results
            title: The tool shall write self-validation results to a file in TRX or
              JUnit XML format.
            justification: |
              Standard test result formats allow CI/CD systems and dashboards to consume
              and display self-validation outcomes without custom tooling.
            tags:
              - validation
            children:
              - VersionMark-Validation-WriteResults
            tests:
              - SelfTest_Run_WithResultsFlag_WritesResultsFile
              - SelfTest_Run_WithResultsXmlFlag_WritesJUnitResultsFile
