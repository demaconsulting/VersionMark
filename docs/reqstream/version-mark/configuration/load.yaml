---
sections:
  - title: VersionMark Requirements
    sections:
      - title: Configuration Requirements
        sections:
          - title: Load Requirements
            requirements:
              - id: VersionMark-Load-FileExistence
                title: The tool shall report an error when the configuration file
                  does not exist.
                justification: |
                  Users may specify an incorrect path; an immediate, clear error message
                  avoids silent failures and directs the user to fix the file path.
                tags:
                  - configuration
                tests:
                  - VersionMarkConfig_Load_MissingFile_ReturnsNullConfig

              - id: VersionMark-Load-YamlParsing
                title: The tool shall report an error when the configuration file
                  contains invalid YAML.
                justification: |
                  Malformed YAML cannot be interpreted. Reporting a parse error with its
                  location lets users quickly find and fix the syntax issue.
                tags:
                  - configuration
                tests:
                  - VersionMarkConfig_Load_InvalidYaml_ReturnsNullConfig

              - id: VersionMark-Load-RootMapping
                title: The tool shall report an error when the root node of the configuration
                  file is not a YAML mapping.
                justification: |
                  A valid configuration file must have a mapping at its root so that top-level
                  keys such as 'tools' can be located. A scalar, sequence, or other node type
                  at the root cannot contain tool definitions and must be rejected immediately.
                tags:
                  - configuration
                tests:
                  - VersionMarkConfig_Load_NonMappingRoot_ReturnsNullConfig

              - id: VersionMark-Load-ToolsSection
                title: The tool shall report an error when the configuration file
                  is missing a non-empty 'tools' section.
                justification: |
                  A configuration without any tool definitions cannot perform any useful
                  capture or publish operations.
                tags:
                  - configuration
                tests:
                  - VersionMarkConfig_Load_MissingToolsSection_ReturnsNullConfig
                  - VersionMarkConfig_Load_EmptyToolsSection_ReturnsNullConfig

              - id: VersionMark-Load-ToolCommand
                title: The tool shall report an error when a tool is missing a non-empty
                  'command' field.
                justification: |
                  The 'command' field defines how to invoke the tool to obtain version
                  information. Without it the tool cannot function at runtime.
                tags:
                  - configuration
                tests:
                  - VersionMarkConfig_Load_MissingCommand_ReturnsNullConfig
                  - VersionMarkConfig_Load_EmptyCommand_ReturnsNullConfig

              - id: VersionMark-Load-ToolRegex
                title: The tool shall report an error when a tool is missing a non-empty
                  'regex' field.
                justification: |
                  The 'regex' field is used to extract the version string from command output.
                  Without it the tool cannot parse a version at runtime.
                tags:
                  - configuration
                tests:
                  - VersionMarkConfig_Load_MissingRegex_ReturnsNullConfig
                  - VersionMarkConfig_Load_EmptyRegex_ReturnsNullConfig

              - id: VersionMark-Load-RegexValid
                title: The tool shall report an error when a regex value cannot be
                  compiled.
                justification: |
                  An invalid regex pattern will cause a runtime failure. Detecting it early
                  during load gives the user a clear error with a precise file location.
                tags:
                  - configuration
                tests:
                  - VersionMarkConfig_Load_InvalidRegex_ReturnsNullConfig

              - id: VersionMark-Load-RegexVersion
                title: The tool shall report an error when a regex does not contain
                  a named 'version' capture group.
                justification: |
                  The capture group named 'version' is the mechanism by which the tool
                  extracts the version string. Its absence causes silent data loss at runtime.
                tags:
                  - configuration
                tests:
                  - VersionMarkConfig_Load_RegexMissingVersionGroup_ReturnsNullConfig

              - id: VersionMark-Load-OsOverrides
                title: The tool shall report an error when an OS-specific command
                  or regex override is empty.
                justification: |
                  An empty OS-specific override will be used at runtime on the corresponding
                  platform, causing a capture failure. Detecting it during load prevents
                  platform-specific surprises.
                tags:
                  - configuration
                tests:
                  - VersionMarkConfig_Load_OsSpecificEmptyCommand_ReturnsNullConfig
                  - VersionMarkConfig_Load_OsSpecificEmptyRegex_ReturnsNullConfig

              - id: VersionMark-Load-UnknownKeys
                title: The tool shall report unknown keys as non-fatal warnings that
                  do not fail loading.
                justification: |
                  Unknown keys may be typos or forward-compatible extensions. Treating them
                  as warnings alerts users without blocking valid configurations from
                  proceeding.
                tags:
                  - configuration
                tests:
                  - VersionMarkConfig_Load_UnknownTopLevelKey_ReturnsConfig
                  - VersionMarkConfig_Load_UnknownToolKey_ReturnsConfig

              - id: VersionMark-Load-AllIssues
                title: The tool shall report all load issues discovered in one invocation
                  without stopping at the first error.
                justification: |
                  Reporting all issues at once lets users fix everything in one edit cycle
                  rather than repeatedly re-running to discover each subsequent problem.
                tags:
                  - configuration
                tests:
                  - VersionMarkConfig_Load_MultipleErrors_ReportsAll

              - id: VersionMark-Load-IssueLocation
                title: >-
                  The VersionMarkConfig.Load method shall report all load findings
                  with
                  the filename and line/column location.
                justification: |
                  Precise locations (file, line, column) allow users to jump directly to the
                  problem in their editor, dramatically reducing the time needed to fix issues.
                tests:
                  - VersionMarkConfig_Load_IssuesContainFilePath

              - id: VersionMark-Load-Return
                title: >-
                  The VersionMarkConfig.Load method shall return both the loaded
                  configuration and all validation issues in a single result value.
                justification: |
                  Returning both the config and issues allows callers to proceed when only
                  warnings are present while rejecting configurations with fatal errors.
                tests:
                  - VersionMarkConfig_Load_ValidConfig_ReturnsConfig
                  - VersionMarkConfig_Load_MissingFile_ReturnsNullConfig

              - id: VersionMark-Load-OsRegexValid
                title: >-
                  The tool shall report an error when an OS-specific regex override
                  cannot be compiled.
                justification: |
                  An invalid OS-specific regex pattern will cause a runtime failure on the
                  corresponding platform. Detecting it during load gives the user a clear
                  error with a precise file location before deployment.
                tags:
                  - configuration
                tests:
                  - VersionMarkConfig_Load_OsSpecificInvalidRegex_ReturnsNullConfig

              - id: VersionMark-Load-OsRegexVersion
                title: >-
                  The tool shall report an error when an OS-specific regex override
                  does
                  not contain a named 'version' capture group.
                justification: |
                  The capture group named 'version' is the mechanism by which the tool
                  extracts the version string. Its absence in an OS-specific override causes
                  silent data loss at runtime on the corresponding platform.
                tags:
                  - configuration
                tests:
                  - VersionMarkConfig_Load_OsSpecificRegexMissingVersionGroup_ReturnsNullConfig

              - id: VersionMark-Load-VersionMarkLoadResult-Bundle
                title: >-
                  The VersionMarkLoadResult record shall bundle the loaded configuration
                  and
                  all validation issues in a single return value.
                justification: |
                  Bundling the config and issues in a single return value lets callers
                  distinguish between fatal errors (which prevent loading) and non-fatal
                  warnings (which allow loading to proceed).
                tests:
                  - VersionMarkLoadResult_Constructor_AllFields_AreStoredCorrectly

              - id: VersionMark-Load-VersionMarkLoadResult-ErrorRouting
                title: >-
                  The VersionMarkLoadResult.ReportIssues method shall route error-severity
                  issues to the error stream.
                justification: |
                  Routing errors to the error stream ensures non-zero exit codes are set for
                  fatal issues, allowing calling scripts to detect failure automatically.
                tests:
                  - VersionMarkLoadResult_ReportIssues_Error_WritesToErrorStream

              - id: VersionMark-Load-VersionMarkLoadResult-WarnRouting
                title: >-
                  The VersionMarkLoadResult.ReportIssues method shall route warning-severity
                  issues to standard output.
                justification: |
                  Routing warnings to standard output rather than the error stream signals
                  non-fatal findings to callers without triggering a non-zero exit code.
                tests:
                  - VersionMarkLoadResult_ReportIssues_Warning_WritesToStdOut
