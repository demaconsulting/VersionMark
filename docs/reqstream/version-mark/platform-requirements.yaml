---
sections:
  - title: VersionMark Requirements
    sections:
      - title: Platform Support Requirements
        requirements:
          - id: VersionMark-Platform-Windows
            title: The tool shall build and run on Windows platforms.
            justification: |
              DEMA Consulting tools must support Windows as a major development platform.
            tags:
              - platform
              - system
            tests:
              # Tests link to "windows" to ensure results come from Windows platform
              - "windows@VersionMark_CapturesVersions"
              - "windows@VersionMark_GeneratesMarkdownReport"

          - id: VersionMark-Platform-Linux
            title: The tool shall build and run on Linux platforms.
            justification: |
              DEMA Consulting tools must support Linux for CI/CD and containerized environments.
            tags:
              - platform
              - system
            tests:
              # Tests link to "ubuntu" to ensure results come from Linux platform
              - "ubuntu@VersionMark_CapturesVersions"
              - "ubuntu@VersionMark_GeneratesMarkdownReport"

          - id: VersionMark-Platform-MacOS
            title: The tool shall build and run on macOS platforms.
            justification: |
              DEMA Consulting tools must support macOS for developer workstations
              and macOS CI/CD runners.
            tags:
              - platform
              - system
            tests:
              # Tests link to "macos" to ensure results come from macOS platform
              - "macos@VersionMark_CapturesVersions"
              - "macos@VersionMark_GeneratesMarkdownReport"

          - id: VersionMark-Platform-Net10
            title: The tool shall support .NET 10 runtime.
            justification: |
              .NET 10 is a Long-Term Support (LTS) release and the oldest supported .NET runtime,
              providing long-term stability and support for enterprise users.
            tags:
              - platform
              - system
            tests:
              - "dotnet10.x@VersionMark_CapturesVersions"
              - "dotnet10.x@VersionMark_GeneratesMarkdownReport"

          - id: VersionMark-Platform-Net11
            title: The tool shall support .NET 11 runtime.
            justification: |
              .NET 11 support enables users to leverage the latest .NET features and performance
              improvements.
            tags:
              - platform
              - system
            tests:
              - "dotnet11.x@VersionMark_CapturesVersions"
              - "dotnet11.x@VersionMark_GeneratesMarkdownReport"
