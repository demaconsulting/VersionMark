---
# Markdown Linting Configuration
#
# PURPOSE:
# - Maintain professional technical documentation standards
# - Ensure consistent formatting for readability and maintenance
# - Support automated documentation generation and publishing
#
# DO NOT MODIFY: These rules represent coding standards.
# - If files fail linting, fix the files to meet these standards
# - Do not relax rules to accommodate existing non-compliant files
# - Consistency across repositories is critical for documentation quality

# Disable the banner message (e.g., version info) on stdout
noBanner: true

# Disable the progress indicator on stdout
noProgress: true

config:
  # Require ATX-style headers (# Header) instead of Setext-style
  MD003:
    style: atx

  # Consistent unordered list markers
  MD004:
    style: dash

  # Set consistent indentation for nested lists
  MD007:
    indent: 2

  # Disable line length rule (no limit enforced)
  MD013: false

  # Allow multiple top-level headers per document
  MD025: false

  # Allow inline HTML for enhanced documentation
  MD033: false

  # Disable first-line-heading: subsystem and unit files intentionally start with  ##
  # because they are assembled by Pandoc into a single document via definition.yaml.
  # In the assembled document the heading hierarchy is correct; markdownlint sees
  # fragments in isolation and would otherwise raise false positives.
  MD041: false

  # Disable table column alignment enforcement.
  # Existing docs use valid pipe tables but do not require visually aligned columns.
  MD060: false

# Exclude common build artifacts, dependencies, and vendored third-party code
ignores:
  - '**/.git/**'
  - '**/node_modules/**'
  - '**/.venv/**'
  - '**/thirdparty/**'
  - '**/third-party/**'
  - '**/3rd-party/**'
  - '**/generated/**'
  - '**/.agent-logs/**'
