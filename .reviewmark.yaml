---
# ReviewMark Configuration File
# This file defines which files require review, where the evidence store is located,
# and how files are grouped into named review-sets following hierarchical scope principles.

# Patterns identifying all files that require review.
# Processed in order; prefix a pattern with '!' to exclude.
needs-review:
  - README.md
  - docs/user_guide/**/*.md
  - '**/*.cs'
  - requirements.yaml
  - docs/reqstream/**/*.yaml
  - docs/design/**/*.md
  - docs/verification/**/*.md
  - '!**/obj/**'
  - '!**/bin/**'
  - '!**/generated/**'
  - '!**/node_modules/**'
  - '!**/.venv/**'

# Evidence source: review data and index.json are located in the 'reviews' branch
# of this repository, accessed through the GitHub public HTTPS raw content access.
evidence-source:
  type: url
  location: https://raw.githubusercontent.com/demaconsulting/VersionMark/reviews/index.json

# Review sets following standardized patterns for hierarchical compliance coverage
reviews:
  # Purpose
  - id: Purpose
    title: Review that Advertised Features Match System Design
    paths:
      - README.md
      - docs/user_guide/**/*.md
      - docs/reqstream/version-mark.yaml
      - docs/design/introduction.md
      - docs/design/version-mark.md

  # VersionMark - Architecture (system-level)
  - id: VersionMark-Architecture
    title: Review that VersionMark Architecture Satisfies Requirements
    paths:
      - docs/reqstream/version-mark.yaml
      - docs/design/introduction.md
      - docs/design/version-mark.md
      - docs/verification/introduction.md
      - docs/verification/version-mark.md
      - test/**/IntegrationTests.cs
      - test/**/AssemblyInfo.cs
      - test/**/Runner.cs

  # VersionMark - Design (consistency and completeness)
  - id: VersionMark-Design
    title: Review that VersionMark Design is Consistent and Complete
    paths:
      - docs/reqstream/version-mark.yaml
      - docs/reqstream/version-mark/platform-requirements.yaml
      - docs/design/introduction.md
      - docs/design/version-mark.md
      - docs/design/version-mark/**/*.md
      - docs/verification/introduction.md
      - docs/verification/ots.md

  # VersionMark - Verification (consistency and completeness)
  - id: VersionMark-Verification
    title: Review that VersionMark Verification is Consistent and Complete
    paths:
      - docs/reqstream/version-mark.yaml
      - docs/verification/introduction.md
      - docs/verification/version-mark.md
      - docs/verification/version-mark/**/*.md
      - docs/verification/ots.md

  # VersionMark - All Requirements
  - id: VersionMark-AllRequirements
    title: Review that All VersionMark Requirements are Complete
    paths:
      - requirements.yaml
      - docs/reqstream/**/*.yaml

  # VersionMark - Cli
  - id: VersionMark-Cli
    title: Review that VersionMark Cli Satisfies Subsystem Requirements
    paths:
      - docs/reqstream/version-mark/cli.yaml
      - docs/design/version-mark/cli.md
      - docs/verification/version-mark/cli.md
      - test/**/Cli/CliTests.cs

  - id: VersionMark-Cli-Program
    title: Review that VersionMark Cli Program Implementation is Correct
    paths:
      - docs/reqstream/version-mark/cli/program.yaml
      - docs/design/version-mark/cli/program.md
      - docs/verification/version-mark/cli/program.md
      - src/**/Program.cs
      - test/**/ProgramTests.cs

  - id: VersionMark-Cli-Context
    title: Review that VersionMark Cli Context Implementation is Correct
    paths:
      - docs/reqstream/version-mark/cli/context.yaml
      - docs/design/version-mark/cli/context.md
      - docs/verification/version-mark/cli/context.md
      - src/**/Cli/Context.cs
      - test/**/Cli/ContextTests.cs

  # VersionMark - Configuration
  - id: VersionMark-Configuration
    title: Review that VersionMark Configuration Satisfies Subsystem Requirements
    paths:
      - docs/reqstream/version-mark/configuration.yaml
      - docs/design/version-mark/configuration.md
      - docs/verification/version-mark/configuration.md
      - test/**/Configuration/ConfigurationTests.cs

  - id: VersionMark-Configuration-VersionMarkConfig
