  - id: VersionMark-Configuration-LintIssue
    title: Review that VersionMark Configuration LintIssue Implementation is Correct
    paths:
      - docs/reqstream/version-mark/configuration/load.yaml
      - docs/design/version-mark/configuration/lint-issue.md
      - docs/verification/version-mark/configuration/lint-issue.md
      - src/**/Configuration/LintIssue.cs
