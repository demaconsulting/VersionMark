---
# VersionMark Requirements
#
# This file defines the requirements for the VersionMark tool.
# Requirements are verified through tests and documented in
# docs/requirements_doc/ and docs/requirements_report/.
#
# root-tags identifies the tags that mark "root" requirements - product-facing
# system requirements and quality/process requirements that exist for their own
# sake and don't need a further parent. Every other requirement must trace up
# (via children links) to at least one root-tagged requirement, or it is
# reported as orphaned - a requirement implemented, tested, and documented but
# never connected to anything a user or the repository's compliance process
# actually needs. Because root-tags is configured here, orphan checking runs
# automatically on every "reqstream" invocation (including --lint and
# --enforce) without needing a --root-tags command-line flag.
root-tags: [system, quality]

includes:
  - docs/reqstream/version-mark.yaml
  - docs/reqstream/version-mark/platform-requirements.yaml
  - docs/reqstream/version-mark/cli.yaml
  - docs/reqstream/version-mark/cli/program.yaml
  - docs/reqstream/version-mark/cli/context.yaml
  - docs/reqstream/version-mark/capture.yaml
  - docs/reqstream/version-mark/capture/version-info.yaml
  - docs/reqstream/version-mark/publishing.yaml
  - docs/reqstream/version-mark/publishing/markdown-formatter.yaml
  - docs/reqstream/version-mark/configuration.yaml
  - docs/reqstream/version-mark/configuration/version-mark-config.yaml
  - docs/reqstream/version-mark/configuration/tool-config.yaml
  - docs/reqstream/version-mark/configuration/load.yaml
  - docs/reqstream/version-mark/configuration/lint-issue.yaml
  - docs/reqstream/version-mark/self-test.yaml
  - docs/reqstream/version-mark/self-test/validation.yaml
  - docs/reqstream/version-mark/utilities.yaml
  - docs/reqstream/version-mark/utilities/glob-matcher.yaml
  - docs/reqstream/version-mark/utilities/path-helpers.yaml
  - docs/reqstream/quality.yaml
  - docs/reqstream/ots/xunit.yaml
  - docs/reqstream/ots/reqstream.yaml
  - docs/reqstream/ots/buildmark.yaml
  - docs/reqstream/ots/sarifmark.yaml
  - docs/reqstream/ots/sonarmark.yaml
  - docs/reqstream/ots/reviewmark.yaml
  - docs/reqstream/ots/pandoc.yaml
  - docs/reqstream/ots/weasyprint.yaml
  - docs/reqstream/ots/fileassert.yaml
