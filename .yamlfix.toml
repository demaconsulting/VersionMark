# YAML Auto-Fix Configuration
#
# PURPOSE:
# - Configure yamlfix to auto-fix common YAML issues before yamllint checks
# - Settings align with .yamllint.yaml to avoid conflicts
# - Use 'pwsh ./fix.ps1' or run 'yamlfix .' before 'pwsh ./lint.ps1' to auto-fix
#
# MODIFICATION POLICY:
#   Do not modify these rules except to align with .yamllint.yaml changes.

preserve_quotes = true
sequence_style = "keep_style"
whitelines = 1
