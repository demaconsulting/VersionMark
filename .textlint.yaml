---
# Spell-Checking with TextLint
#
# PURPOSE:
# - Maintain professional documentation and code quality
# - Catch spelling errors before publication
# - Support consistent technical terminology usage
# - NEVER add a misspelled word - fix the typo in the source instead
# - NEVER add a British-English spelling - correct to US-English in the source
# - PROPOSE only genuine technical terms/names as needed

version: '0.2'
language: en

# Files to spell-check when textlint runs with no arguments
files:
  - "**/*.{md,yaml,yml,json,cs,cpp,hpp,h,txt}"
enableGlobDot: true

# Project-specific technical terms and tool names
words:
  - DEMA
  - demaconsulting
  - DEMACONSULTINGNUGETKEY
  - entrantly
  - Hostx
  - misparse
  - ncipollo
  - nestings
  - netstandard
  - sarif
  - Setext
  - shopt
  - slnx
  - snupkg
  - sonarscanner
  - thirdparty
  - unidirectionality
  - venv
  - VSINSTALLDIR
  - yamlfix

# Exclude common build artifacts, dependencies, and vendored third-party code
ignorePaths:
  - '**/.git/**'
  - '**/node_modules/**'
  - '**/.venv/**'
  - '**/thirdparty/**'
  - '**/third-party/**'
  - '**/3rd-party/**'
  - '**/generated/**'
  - '**/.agent-logs/**'
  - '**/bin/**'
  - '**/obj/**'
  - package-lock.json
